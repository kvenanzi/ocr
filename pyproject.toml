[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrbench"
version = "0.1.0"
description = "Benchmark classic OCR engines and OCR vision-language models on accuracy, speed, resources and cost."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "huggingface_hub>=0.34",
  "pandas>=2.0",
  "pyarrow>=14",
  "pillow>=10",
  "numpy>=1.24",
  "pyyaml>=6",
  "rapidfuzz>=3.6",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "psutil>=5.9",
  "pypdfium2>=4.30",
  "fuzzysearch>=0.7",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ocrbench = "ocrbench.cli:main"

[tool.setuptools.packages.find]
include = ["ocrbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
